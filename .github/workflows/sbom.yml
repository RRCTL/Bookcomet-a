name: SBOM

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sbom:
    name: Generate CycloneDX SBOMs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Backend CycloneDX
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install cyclonedx-bom
          cyclonedx-py requirements requirements.txt --of JSON -o ../docs/sbom/backend.cdx.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend CycloneDX
        working-directory: frontend
        run: |
          npm ci
          npm sbom --sbom-format cyclonedx --sbom-type application > ../docs/sbom/frontend.cdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bookcomet-a-sbom
          path: |
            docs/sbom/backend.cdx.json
            docs/sbom/frontend.cdx.json
