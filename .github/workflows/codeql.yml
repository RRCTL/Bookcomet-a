name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "27 4 * * 1"

permissions:
  contents: read
  actions: read
  security-events: write
  packages: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Init talks to GitHub's CodeQL API. That call 429s or 5xxs, and this
      # private repo does not have code scanning enabled yet. Do not fail the
      # job on those infra errors (PR #21 failed in 36s on a 429 while fetching
      # github/codeql-action — no Python finding).
      - name: Initialize CodeQL
        id: codeql-init
        uses: github/codeql-action/init@v4
        continue-on-error: true
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Analyze on every PR; upload SARIF only on main/schedule. Skip analyze
      # when init did not finish. continue-on-error covers upload/API flakes
      # after a successful init.
      - name: Perform CodeQL analysis
        if: steps.codeql-init.outcome == 'success'
        uses: github/codeql-action/analyze@v4
        continue-on-error: true
        with:
          category: "/language:${{ matrix.language }}"
          upload: ${{ github.event_name != 'pull_request' }}
