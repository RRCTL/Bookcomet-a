version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # @eslint/js 10+ peers eslint ^10. Stay on 9.x until eslint,
      # typescript-eslint, and the flat config are upgraded together.
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # plugin-react 6+ peers vite ^8. Stay on 5.x until Vite 8 is adopted.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
    groups:
      # React 19 requires react and react-dom to share an exact version
      # (PR #28 failed tests when only react was bumped).
      react-core:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
